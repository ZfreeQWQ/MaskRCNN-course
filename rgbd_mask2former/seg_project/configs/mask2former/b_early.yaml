# B-early: B + naive 4-channel early depth fusion, scale-corrected (docs/plan.md "对照").
# Depth channel pre-standardized to RGB-like magnitude by rgbd_seg.depth_geometry.standardize
# (reused at 1-channel granularity here is NOT how I1 works -- this is the simple contrast case,
# i.e. plain channel concatenation into the stock 3-channel stem, expanded to 4ch, zero-init on
# the 4th weight so it starts as an exact no-op like I1's gated fusion does for the whole branch).
_BASE_: base.yaml
MODEL:
  PIXEL_MEAN: [123.675, 116.280, 103.530, 0.0]
  PIXEL_STD: [58.395, 57.120, 57.375, 50.0]
PROJECT:
  USE_DEPTH: True
OUTPUT_DIR: /private/rgzndzy/seg_project/experiments/mask2former/b_early

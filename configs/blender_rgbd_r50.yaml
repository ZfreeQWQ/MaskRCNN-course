_BASE_: coco/instance-segmentation/maskformer2_R50_bs16_50ep.yaml
MODEL:
  WEIGHTS: weights/mask2former_r50_coco_rgbd.pth
  PIXEL_MEAN: [123.675, 116.280, 103.530, 32.0]
  PIXEL_STD: [58.395, 57.120, 57.375, 64.0]
  SEM_SEG_HEAD:
    NUM_CLASSES: 1
DATASETS:
  TRAIN: ("blender_rgbd_train",)
  TEST: ("blender_rgbd_val",)
DATALOADER:
  NUM_WORKERS: 4
  FILTER_EMPTY_ANNOTATIONS: False
SOLVER:
  IMS_PER_BATCH: 2
  OPTIMIZER: ADAMW
  BASE_LR: 0.0001
  BACKBONE_MULTIPLIER: 0.1
  WEIGHT_DECAY: 0.05
  LR_SCHEDULER_NAME: WarmupMultiStepLR
  MAX_ITER: 30000
  STEPS: (18000, 24000)
  GAMMA: 0.1
  WARMUP_FACTOR: 0.01
  WARMUP_ITERS: 250
  CHECKPOINT_PERIOD: 1000
  AMP:
    ENABLED: False
INPUT:
  FORMAT: RGB
  IMAGE_SIZE: 1024
  MIN_SCALE: 0.5
  MAX_SCALE: 1.5
TEST:
  EVAL_PERIOD: 0
  DETECTIONS_PER_IMAGE: 100
  AUG:
    ENABLED: False
SEED: 42
CUDNN_BENCHMARK: False
OUTPUT_DIR: runs/mask2former_r50_rgbd_baseline
